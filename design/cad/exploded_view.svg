<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#20252b}.part{stroke:#2d3640;stroke-width:2}.line{stroke:#777;stroke-width:2;stroke-dasharray:7 5;fill:none}.label{font-size:20px}.title{font-size:27px;font-weight:bold}</style>
<text x="40" y="45" class="title">Exploded view (schematic, not to scale)</text>
<rect x="250" y="420" width="420" height="70" fill="#dce2e7" class="part"/><text x="460" y="460" text-anchor="middle" class="label">Chassis plate 240 × 180</text>
<rect x="350" y="315" width="190" height="65" fill="#30363d" class="part"/><text x="445" y="355" text-anchor="middle" fill="white" class="label">Battery</text>
<rect x="570" y="315" width="85" height="45" fill="#3a8664" class="part"/><text x="612" y="343" text-anchor="middle" class="label">ESP32</text>
<rect x="360" y="215" width="190" height="38" fill="#c8a15d" class="part"/><text x="455" y="240" text-anchor="middle" class="label">Arm link + gripper</text>
<rect x="720" y="215" width="70" height="70" fill="#c54c3a" class="part"/><text x="755" y="305" text-anchor="middle" class="label">50 mm cube</text>
<circle cx="245" cy="420" r="40" fill="#343a40" class="part"/><circle cx="675" cy="420" r="40" fill="#343a40" class="part"/><circle cx="245" cy="500" r="40" fill="#343a40" class="part"/><circle cx="675" cy="500" r="40" fill="#343a40" class="part"/>
<path d="M445 315 V275 M455 215 V170 M755 215 V150 M460 380 V410" class="line"/>
<text x="40" y="105" class="label">Parts are separated vertically to make the assembly easier to understand.</text>
<text x="40" y="135" class="label">Wheels, battery, controller and arm are simplified blocks; fasteners are omitted.</text>
</svg>
